[build-system]
requires = ["setuptools>=61.0", "setuptools_scm", "cython", "numpy"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
# Three-segment tags like ``v0.3.1`` / ``0.3.1``. ``guess-next-dev`` gives
# clean versions on tags (worktree exactly at ``v0.3.1`` -> ``0.3.1``) and
# ``0.3.2.dev<n>`` on commits after the tag. ``no-local-version`` strips
# the ``+g<sha>`` suffix so wheels/sdists are PyPI-uploadable.
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"
write_to = 'cytozip/_version.py'
tag_regex = "^v?(?P<version>[^-+]+)"

[project]
name = "cytozip"
dynamic = ["version"]
dependencies = ['pandas', 'numpy', 'pysam', 'loguru',
                'fsspec', 'requests',
                'anndata', 'scipy']

[project.optional-dependencies]
# fast-fisher is a PyPI-only package (not on conda-forge / bioconda).
# Only needed by `cytozip.pivot.pivot_fisher`. Install with:
#     pip install cytozip[pivot]
pivot = ['fast-fisher']
authors = [
  { name="Wubin Ding", email="ding.wu.bin.gm@gmail.com" },
]
description = "cytozip: Chunk based ZIP for cytosine data"
keywords = ["zip", "methylation",'cytosine','allc']
readme = "README.md"
requires-python = ">=3.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
license = {file = "LICENSE"}

[project.scripts]
czip="cytozip:main"

[project.urls]
"Homepage" = "https://github.com/DingWB/cytozip"
repository = "https://github.com/DingWB/cytozip"
"Bug Tracker" = "https://github.com/DingWB/cytozip/issues"
documentation = "https://dingwb.github.io/cytozip"