{% set name = "cytozip" %}
{% set version = "0.4.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: ac3f4966a0edc1c931163458c2af7857731dd38569a11b53b763a2b40c0b1e93 # filled in by bioconda autobump on each release

build:
  number: 0
  # Only py>=3.10 is actually installable: bioconda builds the recipe for
  # 3.10-3.13, and cytozip's deps (numpy/pandas/anndata) no longer ship for
  # 3.8/3.9. htslib is NOT pinned here on purpose -- htslib's run_exports
  # already constrains it at build time (e.g. >=1.24,<1.25).
  # Linux + macOS (x86_64 and arm64). Windows is skipped: htslib / samtools /
  # pysam have no win-64 packages.
  skip: true  # [py<310 or win]
  script: |
    # htslib is guaranteed present in ``host:`` requirements below, so
    # force setup.py to build the ``cytozip._bam_pileup`` extension even
    # if the auto-detection based on ``$PREFIX`` / ``$CONDA_PREFIX``
    # misses the header path for any reason. Without this, the ``test:``
    # phase fails with ``ModuleNotFoundError: cytozip._bam_pileup``.
    export CYTOZIP_FORCE_HTSLIB=1
    {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  entry_points:
    - czip = cytozip:main
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - make
  host:
    - python
    - pip
    - setuptools >=61
    - setuptools_scm
    - cython >=3.0
    - numpy >=2.0
    - htslib
    - libdeflate
    - zlib
    # OpenMP runtime for the conda-forge clang on macOS (gcc on Linux
    # brings libgomp through the compiler's run_exports).
    - llvm-openmp  # [osx]
  run:
    - python
    - numpy >=1.19
    - pandas
    - loguru
    - pysam
    - samtools
    - fsspec
    - requests
    # Lower bound keeps the solver off bioconda's ancient anndata-0.6.22 (imports
    # pandas.core.index, broken with pandas>=1.0) when conda-forge is not on the
    # channel list. cytozip uses anndata.AnnData / layers / h5ad only.
    - anndata >=0.8
    - scipy
    - biopython
    - htslib
    - libdeflate
    - llvm-openmp  # [osx]
    - zlib

test:
  imports:
    - cytozip
    - cytozip.cz_accel
    - cytozip._bam_pileup
  commands:
    - czip --help

about:
  home: https://github.com/DingWB/cytozip
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: 'cytozip: Chunk-based ZIP for cytosine (methylation) data'
  description: |
    A columnar, randomly-accessible compressed format for single-base
    cytosine methylation data, with a fast in-process htslib pileup
    backend for BAM → cz conversion.
  doc_url: https://dingwb.github.io/cytozip
  dev_url: https://github.com/DingWB/cytozip

extra:
  recipe-maintainers:
    - DingWB
