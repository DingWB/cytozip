{% set name = "cytozip" %}
{% set version = "0.4.4" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: abd613f88cfd20cf9ef588ea3e5d473067c52d398da2266f38780eed6dad6e69 # filled in by bioconda autobump on each release

build:
  number: 0
  # Only py>=3.10 is actually installable: bioconda builds the recipe for
  # 3.10-3.13, and cytozip's deps (numpy/pandas/anndata) no longer ship for
  # 3.8/3.9.
  # Linux + macOS (x86_64 and arm64). Windows is skipped: htslib / samtools /
  # pysam have no win-64 packages.
  skip: true  # [py<310 or win]
  # htslib and libdeflate both carry ``run_exports`` with ``max_pin='x.x'``,
  # so whatever minor happens to be current at build time (e.g. htslib 1.25)
  # becomes a hard ``>=1.25,<1.26`` runtime pin. That forces users to
  # upgrade htslib (and with it samtools / bcftools / every other htslib
  # consumer) just to install cytozip, and the solve of a large environment
  # can take tens of minutes or fail. cytozip only uses long-stable
  # htslib/libdeflate APIs; the extensions were verified byte-identical when
  # run against htslib 1.24 and libdeflate 1.26 after being built against
  # htslib 1.25 / libdeflate 1.25 (same SONAMEs: libhts.so.3,
  # libdeflate.so.0). If a future SONAME bump ever breaks loading,
  # ``bam_to_cz`` falls back to ``samtools mpileup`` and the .cz reader to
  # pure Python, so a loose pin is safe. The lower bounds are declared
  # explicitly in ``run:`` below.
  ignore_run_exports_from:
    - htslib
    - libdeflate
  script: |
    # htslib is guaranteed present in ``host:`` requirements below, so
    # force setup.py to build the ``cytozip._bam_pileup`` extension even
    # if the auto-detection based on ``$PREFIX`` / ``$CONDA_PREFIX``
    # misses the header path for any reason. Without this, the ``test:``
    # phase fails with ``ModuleNotFoundError: cytozip._bam_pileup``.
    export CYTOZIP_FORCE_HTSLIB=1
    {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  entry_points:
    - czip = cytozip:main
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - make
  host:
    - python
    - pip
    - setuptools >=61
    - setuptools_scm
    - cython >=3.0
    - numpy >=2.0
    - htslib
    - libdeflate
    - zlib
    # OpenMP runtime for the conda-forge clang on macOS (gcc on Linux
    # brings libgomp through the compiler's run_exports).
    - llvm-openmp  # [osx]
  run:
    - python
    - numpy >=1.19
    - pandas
    - loguru
    - pysam
    - samtools
    - fsspec
    - requests
    # Lower bound keeps the solver off bioconda's ancient anndata-0.6.22 (imports
    # pandas.core.index, broken with pandas>=1.0) when conda-forge is not on the
    # channel list. cytozip uses anndata.AnnData / layers / h5ad only.
    - anndata >=0.8
    - scipy
    - biopython
    # libhts.so.3 ABI (htslib >=1.10); every symbol used by _bam_pileup
    # exists since 1.10. Keep in sync with the ignore_run_exports_from note.
    - htslib >=1.10
    # libdeflate.so.0 ABI (unchanged across all 1.x); cz_accel only uses the
    # core alloc/compress/decompress API.
    - libdeflate >=1.18
    - llvm-openmp  # [osx]
    - zlib

test:
  imports:
    - cytozip
    - cytozip.cz_accel
    - cytozip._bam_pileup
  commands:
    - czip --help
    - czip bam_to_cz --help

about:
  home: https://github.com/DingWB/cytozip
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: 'cytozip: Chunk-based ZIP for cytosine (methylation) data'
  description: |
    A columnar, randomly-accessible compressed format for single-base
    cytosine methylation data, with a fast in-process htslib pileup
    backend for BAM → cz conversion.
  doc_url: https://dingwb.github.io/cytozip
  dev_url: https://github.com/DingWB/cytozip

extra:
  recipe-maintainers:
    - DingWB
