<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>cytozip browser — remote .cz methylation viewer</title>
<style>
  :root {
    --bg: #ffffff;
    --toolbar: #232635;
    --toolbar2: #2d3145;
    --accent: #4a90d9;
    --border: #d6d9e0;
    --label-bg: #f5f6f8;
    --text: #1c1e26;
    --muted: #8a8f9c;
    --track-w: 190px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    background: var(--bg);
    font-size: 13px;
  }

  /* ── Top toolbar (IGV-style) ─────────────────────────────── */
  .toolbar {
    background: var(--toolbar);
    color: #eef0f5;
    padding: 8px 14px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    border-bottom: 3px solid var(--accent);
  }
  .toolbar .brand {
    font-weight: 700;
    font-size: 15px;
    letter-spacing: .3px;
    margin-right: 6px;
    white-space: nowrap;
  }
  .toolbar .brand span { color: var(--accent); }
  .toolbar input[type=text] {
    background: #1a1c28;
    border: 1px solid #3a3f57;
    color: #eef0f5;
    padding: 5px 8px;
    border-radius: 4px;
    font-size: 12px;
    outline: none;
  }
  .toolbar input[type=text]:focus { border-color: var(--accent); }
  .toolbar button, .panel button {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 5px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
  }
  .toolbar button:hover, .panel button:hover { background: #3a7bc0; }
  .toolbar button.secondary { background: #464b63; }
  .toolbar button.secondary:hover { background: #565c78; }
  .locusbox { display: flex; align-items: center; gap: 6px; margin-left: auto; }
  .locusbox input { width: 230px; }
  .zoombtns button { padding: 4px 9px; font-weight: 700; }

  /* ── Config panel ────────────────────────────────────────── */
  .panel {
    background: var(--toolbar2);
    color: #dfe2ea;
    padding: 10px 14px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px 18px;
    align-items: flex-end;
    border-bottom: 1px solid #171922;
  }
  .field { display: flex; flex-direction: column; gap: 3px; }
  .field label { font-size: 10.5px; text-transform: uppercase; letter-spacing: .5px; color: #9aa0b2; }
  .field input[type=text] {
    background: #1a1c28; border: 1px solid #3a3f57; color: #eef0f5;
    padding: 5px 8px; border-radius: 4px; font-size: 12px; outline: none;
  }
  .field input.url { width: 430px; }
  .field input.name { width: 150px; }
  .field select {
    background: #1a1c28; border: 1px solid #3a3f57; color: #eef0f5;
    padding: 5px 6px; border-radius: 4px; font-size: 12px;
  }

  /* ── Status bar ──────────────────────────────────────────── */
  .status {
    padding: 5px 14px; font-size: 11.5px; color: var(--muted);
    background: #fafbfc; border-bottom: 1px solid var(--border);
    min-height: 24px; white-space: pre-wrap;
  }
  .status.error { color: #b2182b; background: #fdf2f3; }

  /* ── Tracks area ─────────────────────────────────────────── */
  #tracks { user-select: none; }
  .row { display: flex; align-items: stretch; border-bottom: 1px solid var(--border); }
  .label {
    width: var(--track-w); flex: 0 0 var(--track-w);
    background: var(--label-bg); border-right: 1px solid var(--border);
    padding: 6px 8px; font-size: 12px; overflow: hidden;
    display: flex; flex-direction: column; justify-content: center; gap: 3px;
  }
  .label .tname { font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .label .swatch {
    width: 13px; height: 13px; border-radius: 2px; flex: 0 0 auto;
    padding: 0; border: 1px solid var(--border); background: none;
    cursor: pointer; -webkit-appearance: none; -moz-appearance: none; appearance: none;
  }
  .label .swatch::-webkit-color-swatch-wrapper { padding: 0; }
  .label .swatch::-webkit-color-swatch { border: none; border-radius: 2px; }
  .label .swatch::-moz-color-swatch { border: none; border-radius: 2px; }
  .label .meta { font-size: 10.5px; color: var(--muted); }
  .label .ctrls { display: flex; gap: 5px; margin-top: 2px; }
  .label select { font-size: 10.5px; padding: 1px 3px; }
  .label .del {
    cursor: pointer; color: var(--muted); border: none; background: none;
    font-size: 14px; line-height: 1; padding: 0 2px;
  }
  .label .del:hover { color: #b2182b; }
  .view { flex: 1 1 auto; position: relative; cursor: crosshair; overflow: hidden; background: #fff; }
  .view canvas { display: block; width: 100%; height: 100%; }
  .rulerrow .label { background: #eceef2; }
  .rulerrow .view { cursor: ew-resize; }
  /* Height resize handle (bottom edge of each track row) */
  .row .resizer {
    position: absolute; left: 0; right: 0; bottom: 0; height: 6px;
    cursor: ns-resize; z-index: 20; touch-action: none;
  }
  .row .resizer:hover, .row .resizer.dragging { background: rgba(74,144,217,.35); }
  #hover {
    position: fixed; pointer-events: none; background: rgba(28,30,38,.92); color: #fff;
    padding: 4px 7px; border-radius: 4px; font-size: 11px; display: none; z-index: 50;
    white-space: nowrap;
  }
  .empty { padding: 40px 20px; text-align: center; color: var(--muted); }
  .hint code { background: #eef0f5; padding: 1px 4px; border-radius: 3px; }
  /* Group header shown above a set of grouped methylation tracks */
  .grouphdr {
    background: #eef1f6; border-bottom: 1px solid var(--border);
    padding: 3px 10px; font-size: 11px; font-weight: 700;
    color: #3a3f57; letter-spacing: .3px;
  }
  .row.grouped .label { background: #f0f2f6; }
  /* Per-track loading spinner */
  .view.loading::after {
    content: ''; position: absolute; top: 6px; right: 8px;
    width: 12px; height: 12px; box-sizing: border-box;
    border: 2px solid #cfd4de; border-top-color: var(--accent);
    border-radius: 50%; animation: czspin .7s linear infinite; z-index: 15;
  }
  @keyframes czspin { to { transform: rotate(360deg); } }

  /* Per-track selection checkbox + selected-row highlight */
  .label .tname .tsel { margin: 0 3px 0 0; cursor: pointer; flex: 0 0 auto; }
  .row.selected .label { background: #e3eefb; }
  .row.selected { box-shadow: inset 3px 0 0 var(--accent); }
  /* Per-track y-limit button */
  .label .ylimbtn {
    font-size: 10px; padding: 1px 6px; border: 1px solid var(--border);
    background: #fff; color: #3a3f57; border-radius: 3px; cursor: pointer;
    line-height: 1.4; white-space: nowrap;
  }
  .label .ylimbtn:hover { background: #eef3fb; border-color: var(--accent); }

  /* Selection action bar (appears when one or more tracks are selected) */
  #selbar {
    position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
    display: none; align-items: center; gap: 10px; z-index: 80;
    background: var(--toolbar); color: #eef0f5; padding: 8px 14px;
    border-radius: 8px; box-shadow: 0 6px 24px rgba(0,0,0,.28);
    border: 1px solid #3a3f57; font-size: 12px; white-space: nowrap;
  }
  #selbar.show { display: flex; }
  #selbar label { display: flex; align-items: center; gap: 5px; color: #c3c8d6; }
  #selbar #selcount { font-weight: 700; color: #eef0f5; }
  #selbar button {
    background: var(--accent); color: #fff; border: none; padding: 4px 10px;
    border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 600;
  }
  #selbar button:hover { background: #3a7bc0; }
  #selbar button.secondary { background: #464b63; }
  #selbar button.secondary:hover { background: #565c78; }
  #selbar button.danger { background: #b2182b; }
  #selbar button.danger:hover { background: #d0273c; }
  #selbar input[type=color] { width: 26px; height: 22px; padding: 0; border: none; background: none; cursor: pointer; }
  #selbar input[type=number] {
    background: #1a1c28; border: 1px solid #3a3f57; color: #eef0f5;
    padding: 3px 5px; border-radius: 4px; width: 60px; font-size: 12px;
  }

  /* Y-limit editor popup */
  #ylimPopup {
    position: fixed; z-index: 120; background: #fff; border: 1px solid #c9cdd6;
    border-radius: 6px; box-shadow: 0 6px 24px rgba(0,0,0,.18);
    padding: 10px 12px; font-size: 12px; color: #1c1e26; min-width: 210px;
  }
  #ylimPopup label { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  #ylimPopup input[type=number] {
    width: 62px; padding: 2px 4px; border: 1px solid var(--border); border-radius: 3px; font-size: 12px;
  }
  #ylimPopup .ylimbtns { margin-top: 8px; display: flex; gap: 6px; justify-content: flex-end; }
  #ylimPopup button {
    background: var(--accent); color: #fff; border: none; padding: 4px 10px;
    border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 600;
  }
  #ylimPopup button:hover { background: #3a7bc0; }
  #ylimPopup button.secondary { background: #8a8f9c; }
  #ylimPopup button.secondary:hover { background: #767c8a; }</style>
</head>
<body>

<div class="toolbar">
  <div class="brand">cytozip<span>·</span>browser</div>
  <label style="display:flex;align-items:center;gap:5px;white-space:nowrap;">
    <span style="font-size:11px;color:#9aa0b2;">Genome</span>
    <select id="genomeSel" title="Reference genome assembly">
      <option value="">— none —</option>
      <option value="hg38">hg38</option>
      <option value="hg19">hg19</option>
      <option value="mm10">mm10</option>
      <option value="mm39">mm39</option>
    </select>
  </label>
  <button id="btnLoad">Load reference</button>
  <div class="locusbox">
    <input type="text" id="locus" placeholder="chr1:3,000,000-3,050,000 or gene name (e.g. HOXA13)" style="width:300px" />
    <button id="btnGo">Go</button>
    <span class="zoombtns">
      <button id="zoomOut" class="secondary" title="Zoom out">−</button>
      <button id="zoomIn" class="secondary" title="Zoom in">+</button>
    </span>
    <label style="display:flex;align-items:center;gap:4px;white-space:nowrap;font-size:11px;color:#9aa0b2;">
      Res
      <select id="resSel" title="Methylation binning resolution">
        <option value="">None (per-bp)</option>
        <option value="10">10 bp</option>
        <option value="20">20 bp</option>
        <option value="50">50 bp</option>
        <option value="100">100 bp</option>
        <option value="500">500 bp</option>
        <option value="1000">1000 bp</option>
        <option value="5000">5000 bp</option>
      </select>
    </label>
    <label style="display:flex;align-items:center;gap:4px;white-space:nowrap;font-size:11px;color:#9aa0b2;">
      Y
      <select id="yScaleSel" title="Methylation y-axis scale">
        <option value="1">0–1</option>
        <option value="auto">Auto</option>
      </select>
    </label>
    <span class="zoombtns" style="margin-left:8px;">
      <button id="btnSvg" class="secondary" title="Download the current view as vector SVG">SVG</button>
      <button id="btnPng" class="secondary" title="Download the current view as PNG">PNG</button>
      <button id="btnPdf" class="secondary" title="Download the current view as PDF">PDF</button>
    </span>
  </div>
</div>

<div class="panel">
  <div class="field">
    <label>Reference .cz URL (coordinates)</label>
    <input type="text" class="url" id="refUrl"
      value="https://neomorph.salk.edu/ftp/bican/hg38_with_chrL.allc.cz" />
  </div>
  <div class="field">
    <label>New track name</label>
    <input type="text" class="name" id="newName" value="UWA7648 NAC" />
  </div>
  <div class="field">
    <label>New track .cz URL (mc/cov, shares reference)</label>
    <input type="text" class="url" id="newUrl"
      value="https://neomorph.salk.edu/ftp/bican/UWA7648_CX1819_NAC_1_P10-1-K18-A10.cz" />
  </div>
  <div class="field">
    <label>Context</label>
    <select id="newCtx">
      <option value="CG">CG</option>
      <option value="CH">CH</option>
      <option value="CHG">CHG</option>
      <option value="CHH">CHH</option>
      <option value="ALL" selected>All C</option>
    </select>
  </div>
  <div class="field">
    <label>Value</label>
    <select id="newValType" title="Show methylated or unmethylated (1 − mC) fraction">
      <option value="meth" selected>Methylated</option>
      <option value="unmeth">Unmethylated (1 − mC)</option>
    </select>
  </div>
</div>

<div class="panel" style="background:#272b3d;">
  <div class="field">
    <label>Genome tracks</label>
    <span style="font-size:11px;color:#9aa0b2;line-height:26px;">auto-added when a Genome is selected</span>
  </div>
  <div class="field">
    <label>Gene annotation set</label>
    <input type="text" class="name" id="geneSet" list="geneSetList" value="refGene" style="width:170px" />
    <datalist id="geneSetList"></datalist>
  </div>
  <div class="field">
    <label>&nbsp;</label>
    <button id="btnAddTrack" title="Add a methylation .cz track (uses the fields above)">+ Add cz track</button>
  </div>
  <div class="field">
    <label>Track table — file or URL (csv/tsv/xlsx/json): name, url, [Group]</label>
    <div style="display:flex;gap:6px;align-items:center;">
      <input type="file" id="trackTable" accept=".csv,.tsv,.txt,.json,.xlsx,.xls"
        style="font-size:11px;color:#dfe2ea;max-width:140px;" />
      <input type="text" class="url" id="trackTableUrl" placeholder="https://…/tracks.csv" value="https://neomorph.salk.edu/ftp/cz/cz_url.tsv" style="width:170px" />
      <button id="btnTrackTableUrl" class="secondary">Load</button>
    </div>
  </div>
  <div class="field">
    <label>Color palette — file or URL (csv/tsv/xlsx/json): name, color</label>
    <div style="display:flex;gap:6px;align-items:center;">
      <input type="file" id="colorFile" accept=".csv,.tsv,.txt,.json,.xlsx,.xls"
        style="font-size:11px;color:#dfe2ea;max-width:140px;" />
      <input type="text" class="url" id="colorUrl" placeholder="https://…/colors.csv" value="https://neomorph.salk.edu/ftp/cz/Subclass_colors.json" style="width:170px" />
      <button id="btnColorUrl" class="secondary">Load</button>
    </div>
  </div>
  <div class="field" style="margin-left:auto;">
    <label>Saved tracks (click to add)</label>
    <div style="display:flex;gap:6px;">
      <select id="savedTracks" style="width:280px"><option value="">— saved .cz tracks —</option></select>
      <button id="btnForgetTracks" class="secondary" title="Clear saved tracks">Clear</button>
    </div>
  </div>
  <div class="field">
    <label>Session (view + tracks)</label>
    <div style="display:flex;gap:6px;align-items:center;">
      <button id="btnSaveSession" class="secondary" title="Download the current session as JSON">Save</button>
      <input type="file" id="sessionFile" accept=".json" title="Load a session JSON"
        style="font-size:11px;color:#dfe2ea;max-width:120px;" />
    </div>
  </div>
</div>

<div class="status" id="status">Ready. Set the reference URL and click “Load reference”, then “Add track”.</div>

<div id="tracks">
  <div class="empty hint" id="emptyMsg">
    No tracks yet. Click <b>Load reference</b>, then <b>+ Add cz track</b> to visualize a remote <code>.cz</code> file.
  </div>
</div>

<div id="hover"></div>

<div id="selbar">
  <span id="selcount">0 selected</span>
  <button id="selUp" class="secondary" title="Move selected track(s) up">↑ Up</button>
  <button id="selDown" class="secondary" title="Move selected track(s) down">↓ Down</button>
  <label>Color <input type="color" id="selColor" title="Recolor selected track(s)"></label>
  <label>Height <input type="number" id="selHeight" min="22" step="1" title="Set height of selected track(s)"></label>
  <button id="selYlim" title="Set Y-axis limits for selected track(s)">Y-lim…</button>
  <button id="selDelete" class="danger" title="Remove selected track(s)">Delete</button>
  <button id="selClear" class="secondary" title="Clear selection">Clear</button>
</div>

<script type="module">
// ─────────────────────────────────────────────────────────────────────────────
// cytozip browser — remote .cz methylation viewer
//
// Loads the cz_reader.mjs ES module directly from a (raw GitHub) URL, then
// visualizes remote .cz files like a genome browser. A coordinate-less value
// file (mc/cov) is joined against a shared reference .cz by global row index
// (reader.queryWithIndex + reader.getRowValues).
// ─────────────────────────────────────────────────────────────────────────────

const PALETTE = ['#2166ac', '#b2182b', '#1b7837', '#762a83', '#e08214', '#01665e', '#c51b7d', '#4d4d4d'];

// ── WashU-hosted genome resources ────────────────────────────────────────────
// Reference DNA sequence is served as UCSC .2bit (read via @gmod/twobit over
// HTTP Range). Gene annotations come from the WashU REST API (returns JSON gene
// records for a locus) — no static file to host ourselves.
const TWOBIT_BASE = 'https://vizhub.wustl.edu/public';
const GENE_API = 'https://lambda.epigenomegateway.org/v3';
const GENOMES = {
  hg38: { twoBit: `${TWOBIT_BASE}/hg38/hg38.2bit`,
          genes: ['refGene', 'gencodeV47', 'gencodeV39'],
          defaultLocus: 'chr7:27,150,000-27,250,000' },
  hg19: { twoBit: `${TWOBIT_BASE}/hg19/hg19.2bit`,
          genes: ['refGene', 'gencodeV47', 'gencodeV39'],
          defaultLocus: 'chr7:27,180,000-27,280,000' },
  mm10: { twoBit: `${TWOBIT_BASE}/mm10/mm10.2bit`,
          genes: ['refGene', 'gencodeCompVM25', 'gencodeM19Basic'],
          defaultLocus: 'chr5:51,997,000-52,150,000' },
  mm39: { twoBit: `${TWOBIT_BASE}/mm39/mm39.2bit`,
          genes: ['refGene', 'gencodeCompVM28'],
          defaultLocus: 'chr5:52,000,000-52,150,000' },
};
const SAVED_TRACKS_KEY = 'czviewer_saved_tracks_v1';

// cz_reader.mjs is vendored next to this page (same origin) for stability and
// offline/CORS-free loading. Resolve it relative to this module's own URL so it
// works whether the page is served from _static/ or the site root.
const MODULE_URL = new URL('cz_reader.mjs', import.meta.url).href;

// Default track heights (px). Users can drag the bottom edge to resize.
const DEFAULT_HEIGHT = { seq: 30, mc: 118, gene: 150 };
const MIN_HEIGHT = 22;
function trackHeight(t) { return t.height || DEFAULT_HEIGHT[t.kind] || 100; }

const state = {
  CzReader: null,
  refUrl: null,
  refReader: null,
  chroms: [],
  genome: '',           // selected assembly (hg38/hg19/mm10/mm39/'')
  twoBit: null,         // { genome, tb } cached @gmod/twobit handle
  locus: null,          // {chrom, start, end}
  resolution: null,     // methylation binning: null = per-bp, else bin width in bp
  colorMap: {},         // { trackName: colorCode } from an uploaded palette
  yScale: '1',          // mc y-axis: '1' = fixed 0-1, 'auto' = per-track max
  tracks: [],           // {id, kind:'mc'|'seq'|'gene', name, url, reader, color, ctx, canvas, labelEl, metaEl}
  gen: 0,               // render generation token (drops stale async draws)
  trackSeq: 0,
  selected: new Set(),  // ids of currently-selected tracks (for batch actions)
  lastSelectedId: null, // anchor for Shift-range selection
};

const $ = (id) => document.getElementById(id);
const statusEl = $('status');
function setStatus(msg, isErr = false) {
  statusEl.textContent = msg;
  statusEl.classList.toggle('error', !!isErr);
}
const fmtInt = (n) => n.toLocaleString('en-US');

// ── Automatic CORS handling (global fetch wrapper) ───────────────────────────
// IMPORTANT: CORS is enforced by the browser from the *server's response*
// headers; it CANNOT be disabled by adding request headers from client-side JS.
// The only client-side remedy is to route the request through a proxy that
// re-serves the bytes WITH an `Access-Control-Allow-Origin` header AND — crucial
// for .cz random reads — forwards HTTP `Range` requests, returning 206 replies.
//
// We transparently wrap globalThis.fetch(): every cross-origin data request is
// tried directly first; if the browser blocks it (CORS surfaces as a TypeError)
// we remember that host and automatically retry through the configured proxy
// (the "CORS proxy" field, or DEFAULT_PROXY when that field is empty). All of
// the reader's HEAD + Range requests flow through here, so nothing else changes.
const DEFAULT_PROXY = 'https://corsproxy.io/?url=';
const _proxyBadHosts = new Set();

function _proxyPrefix() {
  const el = document.getElementById('proxy');
  const v = (el && el.value.trim()) || '';
  return v || DEFAULT_PROXY;
}
function _applyProxy(url, prefix) {
  // "?url=" / "?"-terminated prefixes expect a URL-encoded target; a bare
  // prefix is simply concatenated in front of the raw URL.
  return /[?&=]$/.test(prefix) ? prefix + encodeURIComponent(url) : prefix + url;
}
const _origFetch = globalThis.fetch.bind(globalThis);
globalThis.fetch = async function (input, init) {
  const rawUrl = (typeof input === 'string') ? input
               : (input && input.url) ? input.url : null;
  let u = null;
  if (rawUrl) { try { u = new URL(rawUrl, location.href); } catch { u = null; } }
  const isCross = u && /^https?:$/.test(u.protocol) && u.origin !== location.origin;
  const prefix = _proxyPrefix();
  const proxyBase = prefix ? prefix.split('?')[0] : '';
  const alreadyProxied = rawUrl && proxyBase && rawUrl.startsWith(proxyBase);

  // Same-origin, no proxy available, or already going through a proxy: passthru.
  if (!isCross || !prefix || alreadyProxied) return _origFetch(input, init);

  // Host already known to require a proxy → skip the (doomed) direct attempt.
  if (_proxyBadHosts.has(u.host)) return _origFetch(_applyProxy(rawUrl, prefix), init);

  try {
    return await _origFetch(input, init);              // try the server directly
  } catch (err) {
    // Direct request blocked (almost always CORS). Remember host + retry proxied.
    _proxyBadHosts.add(u.host);
    try {
      return await _origFetch(_applyProxy(rawUrl, prefix), init);
    } catch (_err2) {
      throw err;                                        // surface the clearer error
    }
  }
};

// ── Dynamically import the reader module from any URL ────────────────────────
// raw.githubusercontent.com serves text/plain, which the browser refuses to
// import as a module. Fetch the source and import it via a Blob URL instead.
async function loadModule(url) {
  const resp = await fetch(url, { cache: 'no-cache' });
  if (!resp.ok) throw new Error(`module HTTP ${resp.status}`);
  const src = await resp.text();
  const blob = new Blob([src], { type: 'text/javascript' });
  const blobUrl = URL.createObjectURL(blob);
  try {
    return await import(blobUrl);
  } finally {
    URL.revokeObjectURL(blobUrl);
  }
}

// ── Locus parsing / formatting ───────────────────────────────────────────────
function parseLocus(text) {
  const m = String(text).trim().match(/^([^\s:]+)\s*:\s*([\d,]+)\s*-\s*([\d,]+)$/);
  if (!m) return null;
  const start = parseInt(m[2].replace(/,/g, ''), 10);
  const end = parseInt(m[3].replace(/,/g, ''), 10);
  if (!(end > start)) return null;
  return { chrom: m[1], start, end };
}
function locusText(l) {
  return `${l.chrom}:${fmtInt(Math.round(l.start))}-${fmtInt(Math.round(l.end))}`;
}
function syncLocusInput() {
  if (state.locus) $('locus').value = locusText(state.locus);
}

// ── Context filter ───────────────────────────────────────────────────────────
// context is a 3-mer starting at the C (e.g. 'CGT', 'CAT').
function ctxMatch(ctx, filter) {
  if (!ctx || ctx[0] !== 'C') return false;
  switch (filter) {
    case 'ALL': return true;
    case 'CG':  return ctx[1] === 'G';
    case 'CH':  return ctx[1] !== 'G';
    case 'CHG': return ctx[1] !== 'G' && ctx[2] === 'G';
    case 'CHH': return ctx[1] !== 'G' && ctx[2] !== 'G';
    default:    return true;
  }
}

// ── Load reference ───────────────────────────────────────────────────────────
async function loadReference() {
  const url = $('refUrl').value.trim();
  if (!url) { setStatus('Enter a reference .cz URL first.', true); return; }
  try {
    setStatus('Loading cz_reader.mjs module…');
    if (!state.CzReader) {
      const mod = await loadModule(MODULE_URL);
      state.CzReader = mod.CzReader;
      if (!state.CzReader) throw new Error('module has no CzReader export');
    }
    setStatus('Opening reference .cz (header + chunk index)…');
    const t0 = performance.now();
    const reader = await state.CzReader.fromUrl(url, { randomReadAhead: 256 * 1024 });
    if (reader.header.sortCol === null) {
      reader.close();
      throw new Error('reference must have a sort_col (position) index');
    }
    state.refReader && state.refReader.close();
    state.refReader = reader;
    state.refUrl = url;
    state.chroms = reader.chunkKeys.map(k => k.split('\t')[0]);
    const ms = (performance.now() - t0).toFixed(0);
    setStatus(`Reference loaded in ${ms} ms · ${state.chroms.length} chromosomes · ` +
              `columns [${reader.header.columns.join(', ')}]. Now add a track.`);
    // default locus
    if (!state.locus) {
      const chrom = state.chroms.includes('chr1') ? 'chr1' : state.chroms[0];
      state.locus = { chrom, start: 3_000_000, end: 3_050_000 };
      syncLocusInput();
    }
    // reset any previously-attached track readers (reference changed)
    render();
  } catch (e) {
    setStatus(corsHint('Failed to load reference: ' + e.message, url), true);
  }
}

function corsHint(msg, url) {
  return msg +
    '\nCross-origin/CORS error: the browser blocked reading this URL because the ' +
    'server sent no `Access-Control-Allow-Origin` header (this cannot be fixed by ' +
    'adding request headers).\nRemedies: (1) enable CORS + HTTP Range on the data ' +
    'server, or (2) host this page on the same origin as the .cz files.';
}

// ── Genome: .2bit sequence via @gmod/twobit ──────────────────────────────────
let _twoBitLibs = null;
async function getTwoBitLibs() {
  if (!_twoBitLibs) {
    const [{ TwoBitFile }, { RemoteFile }] = await Promise.all([
      import('https://esm.sh/@gmod/twobit@6'),
      import('https://esm.sh/generic-filehandle2@2'),
    ]);
    _twoBitLibs = { TwoBitFile, RemoteFile };
  }
  return _twoBitLibs;
}
async function loadTwoBit(genome) {
  if (state.twoBit && state.twoBit.genome === genome) return state.twoBit.tb;
  const cfg = GENOMES[genome];
  if (!cfg) throw new Error(`Unknown genome “${genome}”`);
  const { TwoBitFile, RemoteFile } = await getTwoBitLibs();
  // RemoteFile routes through the (wrapped) global fetch, so the CORS proxy
  // fallback and Range handling apply to .2bit reads too.
  const tb = new TwoBitFile({
    filehandle: new RemoteFile(cfg.twoBit, { fetch: (u, o) => fetch(u, o) }),
  });
  state.twoBit = { genome, tb };
  return tb;
}

// ── Genome selector ──────────────────────────────────────────────────────────
// Selecting a genome automatically (re)creates the reference sequence (.2bit)
// and gene-annotation tracks for that assembly — no manual buttons needed.
async function onGenomeChange() {
  const g = $('genomeSel').value;
  state.genome = g;
  const dl = $('geneSetList');
  dl.innerHTML = '';
  // Drop any sequence/gene tracks belonging to the previous assembly.
  for (const t of state.tracks) { if (t.reader) t.reader.close(); }
  state.tracks = state.tracks.filter(t => t.kind !== 'seq' && t.kind !== 'gene');
  state.twoBit = null;

  if (!g || !GENOMES[g]) { buildTrackRows(); render(); return; }

  for (const name of GENOMES[g].genes) {
    const opt = document.createElement('option');
    opt.value = name;
    dl.appendChild(opt);
  }
  if (!GENOMES[g].genes.includes($('geneSet').value.trim())) {
    $('geneSet').value = GENOMES[g].genes[0] || 'refGene';
  }
  if (!state.locus) {
    const l = parseLocus(GENOMES[g].defaultLocus);
    if (l) { state.locus = l; syncLocusInput(); }
  }
  // Auto-add the sequence + gene tracks for the selected assembly.
  await addSeqTrack(true);
  addGeneTrack(true);
  setStatus(`Genome ${g}: added sequence + gene tracks. ` +
            'Search a locus (chr:start-end) or a gene name in the box above.');
}

// ── Gene name search (WashU queryName API) ───────────────────────────────────
// Returns the best-matching gene record {chrom, txStart, txEnd, name, ...} or null.
async function searchGeneByName(name) {
  const g = state.genome;
  if (!g || !name) return null;
  const url = `${GENE_API}/${g}/genes/queryName?q=${encodeURIComponent(name)}&isExact=false`;
  const resp = await fetch(url);
  if (!resp.ok) throw new Error(`gene name API HTTP ${resp.status}`);
  const recs = await resp.json();
  if (!Array.isArray(recs) || recs.length === 0) return null;
  const lower = name.toLowerCase();
  // Prefer an exact (case-insensitive) name match; else the longest transcript.
  const exact = recs.filter(r => (r.name || '').toLowerCase() === lower);
  const pool = exact.length ? exact : recs;
  return pool.reduce((a, b) =>
    ((b.txEnd - b.txStart) > (a.txEnd - a.txStart) ? b : a));
}

// ── Add a reference-sequence (.2bit) track ───────────────────────────────────
async function addSeqTrack() {
  const g = state.genome;
  if (!g) { setStatus('Pick a genome (hg38/hg19/mm10/mm39) first.', true); return; }
  if (state.tracks.some(t => t.kind === 'seq')) {
    setStatus('A sequence track is already present.'); return;
  }
  try {
    setStatus(`Loading @gmod/twobit and opening ${g}.2bit…`);
    await loadTwoBit(g);
    const track = {
      id: ++state.trackSeq, kind: 'seq', name: `${g} sequence`, genome: g,
      url: GENOMES[g].twoBit, color: '#3a3f57',
    };
    state.tracks.unshift(track);   // sequence belongs at the top
    if (!state.locus) {
      const l = parseLocus(GENOMES[g].defaultLocus);
      if (l) { state.locus = l; syncLocusInput(); }
    }
    buildTrackRows();
    setStatus(`Added ${g} sequence track. Zoom in past ~150 bp to see bases.`);
    render();
  } catch (e) {
    setStatus(corsHint('Failed to load sequence: ' + e.message, GENOMES[g].twoBit), true);
  }
}

// ── Add a gene-annotation track (WashU REST API) ─────────────────────────────
async function addGeneTrack() {
  const g = state.genome;
  if (!g) { setStatus('Pick a genome (hg38/hg19/mm10/mm39) first.', true); return; }
  const set = $('geneSet').value.trim() || 'refGene';
  const track = {
    id: ++state.trackSeq, kind: 'gene', name: `${set} (${g})`,
    geneSet: set, genome: g, url: `${GENE_API}/${g}/genes/${set}/queryRegion`,
    color: '#1b7837',
  };
  state.tracks.push(track);
  if (!state.locus) {
    const l = parseLocus(GENOMES[g].defaultLocus);
    if (l) { state.locus = l; syncLocusInput(); }
  }
  buildTrackRows();
  setStatus(`Added gene track “${set}” for ${g}.`);
  render();
}

async function fetchGenes(track, chrom, start, end) {
  const url = `${track.url}?chr=${encodeURIComponent(chrom)}` +
              `&start=${Math.round(start)}&end=${Math.round(end)}`;
  const resp = await fetch(url);
  if (!resp.ok) throw new Error(`gene API HTTP ${resp.status}`);
  const data = await resp.json();
  return Array.isArray(data) ? data : (data.data || []);
}

// ── Saved-track memory (localStorage) ────────────────────────────────────────
function loadSavedTracks() {
  try { return JSON.parse(localStorage.getItem(SAVED_TRACKS_KEY)) || []; }
  catch { return []; }
}
function saveTrack(entry) {
  const list = loadSavedTracks();
  const key = entry.url;
  const idx = list.findIndex(e => e.url === key);
  if (idx >= 0) list.splice(idx, 1);
  list.unshift(entry);
  if (list.length > 50) list.length = 50;
  try { localStorage.setItem(SAVED_TRACKS_KEY, JSON.stringify(list)); } catch {}
  refreshSavedTracksUI();
}
function refreshSavedTracksUI() {
  const sel = $('savedTracks');
  if (!sel) return;

  sel.innerHTML = '<option value="">— saved .cz tracks —</option>';
  list.forEach((e, i) => {

}
function onSavedTrackPick() {
  const sel = $('savedTracks');
  const i = parseInt(sel.value, 10);
  sel.value = '';
  if (Number.isNaN(i)) return;
  const e = loadSavedTracks()[i];

  $('newValType').value = e.valType || 'meth';
  addTrack();
}


async function addTrack() {
  if (!state.refReader) { setStatus('Load the reference first.', true); return; }
  const url = $('newUrl').value.trim();
  const name = $('newName').value.trim() || `track ${state.tracks.length + 1}`;
  const ctx = $('newCtx').value;
  const valType = $('newValType').value;
  if (!url) { setStatus('Enter a track .cz URL.', true); return; }
  try {
    setStatus(`Opening track “${name}”…`);
    const tr = await openCzTrack({ name, url, ctx, valType });
    saveTrack({ name, url, ctx, valType });
    buildTrackRows();
    setStatus(tr.mismatch ? `Added “${name}”. ${tr.mismatch}` : `Added track “${name}”. Rendering ${locusText(state.locus)}…`, !!tr.mismatch);
    render();
  } catch (e) {
    setStatus(corsHint('Failed to open track: ' + e.message, url), true);
  }
}

// Open a single methylation .cz track and push it into state (no UI side effects).
async function openCzTrack({ name, url, ctx = 'ALL', valType = 'meth', group = '', ylim = 'auto' }) {
  if (!state.refReader) throw new Error('Load the reference first.');
  if (!url) throw new Error('missing URL');
  const reader = await state.CzReader.fromUrl(url, { randomReadAhead: 256 * 1024 });
  const nMc = state.tracks.filter(t => t.kind === 'mc').length;
  const named = name || url.split('/').pop();
  const track = {
    id: ++state.trackSeq, kind: 'mc',
    name: named, url, reader,
    ctx: ctx || 'ALL', valType: valType || 'meth', group: group || '',
    ylim: Array.isArray(ylim) ? ylim : 'auto',
    color: (state.colorMap && state.colorMap[named]) ? normalizeColor(state.colorMap[named]) : PALETTE[nMc % PALETTE.length],
    mismatch: validateAgainstRef(reader),
  };
  state.tracks.push(track);
  return track;
}

// A value (mc/cov) track is joined to the reference by GLOBAL ROW INDEX, so its
// per-chromosome record counts must match the reference exactly. Compare the
// (already-loaded) chunk summaries — no extra network — and return a short
// warning string if they differ (null when consistent).
function validateAgainstRef(reader) {
  try {
    if (!state.refReader || !reader.summaryChunks) return null;
    const refMap = new Map(state.refReader.summaryChunks().map(c => [c.dims.join('\t'), c.nrows]));
    const trkMap = new Map(reader.summaryChunks().map(c => [c.dims.join('\t'), c.nrows]));
    const issues = [];
    for (const [key, refRows] of refMap) {
      const chrom = key.split('\t')[0];
      if (!trkMap.has(key)) { issues.push(`${chrom} missing`); continue; }
      if (trkMap.get(key) !== refRows) issues.push(`${chrom} ${trkMap.get(key)}≠${refRows}`);
    }
    if (!issues.length) return null;
    return `⚠ coordinates differ from reference (${issues.slice(0, 3).join(', ')}${issues.length > 3 ? '…' : ''}) — join may be wrong`;
  } catch (_) { return null; }
}

// ── Track table & color palette (file OR url; csv / tsv / xlsx / json) ────────
function extOf(name) { const m = /\.([a-z0-9]+)(?:[?#].*)?$/i.exec(String(name)); return m ? m[1].toLowerCase() : ''; }

// Read a table source into { kind:'matrix'|'json', data }. `io` provides async
// text()/arrayBuffer() accessors (works for a File or a fetch Response).
async function readTable(ext, io) {
  if (ext === 'xlsx' || ext === 'xls') {
    const XLSX = await import('https://esm.sh/xlsx@0.18.5');
    const wb = XLSX.read(await io.arrayBuffer(), { type: 'array' });
    const ws = wb.Sheets[wb.SheetNames[0]];
    return { kind: 'matrix', data: XLSX.utils.sheet_to_json(ws, { header: 1, blankrows: false, defval: '' }) };
  }
  const text = await io.text();
  if (ext === 'json') return { kind: 'json', data: JSON.parse(text) };
  const delim = ext === 'csv' ? ',' : (ext === 'tsv' ? '\t' : (text.includes('\t') ? '\t' : ','));
  return { kind: 'matrix', data: text.split(/\r?\n/).filter(l => l.trim() !== '').map(l => splitDelimited(l, delim)) };
}
function fileIO(file) { return { text: () => file.text(), arrayBuffer: () => file.arrayBuffer() }; }
function respIO(resp) { return { text: () => resp.text(), arrayBuffer: () => resp.arrayBuffer() }; }

// Minimal delimited-line splitter with quoted-field support.
function splitDelimited(line, delim) {
  const out = []; let cur = '', q = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (q) {
      if (c === '"') { if (line[i + 1] === '"') { cur += '"'; i++; } else q = false; }
      else cur += c;
    } else if (c === '"') q = true;
    else if (c === delim) { out.push(cur); cur = ''; }
    else cur += c;
  }
  out.push(cur);
  return out.map(s => s.trim());
}

// Parsed table → [{name, url, group, ctx}]
function tableToTrackRows(parsed) {
  if (parsed.kind === 'json') {
    const arr = Array.isArray(parsed.data) ? parsed.data : (parsed.data.tracks || []);
    const rows = [];
    for (const it of arr) {
      if (Array.isArray(it)) {
        const [name, url, group] = it;
        if (url) rows.push({ name: String(name || url).trim() || url, url: String(url).trim(), group: String(group || '').trim(), ctx: 'ALL' });
      } else if (it && typeof it === 'object') {
        const url = it.url || it.URL || it.Url; if (!url) continue;
        rows.push({
          name: String(it.name || it.Name || String(url).split('/').pop()).trim(),
          url: String(url).trim(), group: String(it.group || it.Group || '').trim(),
          ctx: it.ctx || it.context || 'ALL',
        });
      }
    }
    return rows;
  }
  const matrix = parsed.data;
  if (!matrix || !matrix.length) return [];
  const first = matrix[0].map(c => String(c).trim().toLowerCase());
  const hasHeader = first[0] === 'name' || first[1] === 'url' || (first[2] || '') === 'group';
  const rows = [];
  for (let i = hasHeader ? 1 : 0; i < matrix.length; i++) {
    const cells = (matrix[i] || []).map(c => String(c).trim());
    const url = cells[1];
    if (!url) continue;
    rows.push({ name: cells[0] || url.split('/').pop(), url, group: cells[2] || '', ctx: 'ALL' });
  }
  return rows;
}

// Parsed table → { trackName: colorCode }
function tableToColorMap(parsed) {
  const map = {};
  if (parsed.kind === 'json') {
    const d = parsed.data;
    if (Array.isArray(d)) {
      for (const it of d) {
        if (Array.isArray(it)) { if (it[0]) map[String(it[0]).trim()] = String(it[1] || '').trim(); }
        else if (it && typeof it === 'object') {
          const n = it.name || it.Name || it.track; const c = it.color || it.Color || it.colour;
          if (n && c) map[String(n).trim()] = String(c).trim();
        }
      }
    } else if (d && typeof d === 'object') {
      for (const k in d) map[k] = String(d[k]).trim();   // { name: color }
    }
    return map;
  }
  const matrix = parsed.data;
  if (!matrix || !matrix.length) return map;
  const first = matrix[0].map(c => String(c).trim().toLowerCase());
  const hasHeader = first[0] === 'name' || first[1] === 'color' || first[1] === 'colour';
  for (let i = hasHeader ? 1 : 0; i < matrix.length; i++) {
    const c = (matrix[i] || []).map(x => String(x).trim());
    if (c[0] && c[1]) map[c[0]] = c[1];
  }
  return map;
}
function normalizeColor(c) {
  c = String(c || '').trim();
  if (/^[0-9a-f]{6}$/i.test(c) || /^[0-9a-f]{3}$/i.test(c)) return '#' + c;   // bare hex
  return c;   // already #hex / rgb() / css name
}
// Normalize any CSS color to a #rrggbb string usable by <input type="color">.
function toHexColor(c) {
  try {
    const cv = document.createElement('canvas').getContext('2d');
    cv.fillStyle = '#888888';
    cv.fillStyle = normalizeColor(c);
    const v = cv.fillStyle;
    if (/^#[0-9a-f]{6}$/i.test(v)) return v;
  } catch (_) {}
  return '#888888';
}
function applyColorMap(map, label) {
  Object.assign(state.colorMap, map);
  let n = 0;
  for (const t of state.tracks) {
    if (t.name in state.colorMap) { t.color = normalizeColor(state.colorMap[t.name]); n++; }
  }
  buildTrackRows(); render();
  setStatus(`Applied ${Object.keys(map).length} color(s) from ${label}; recolored ${n} track(s).`);
}

// Open every track row into the viewer.
async function ingestTrackRows(rows, label) {
  if (!rows.length) { setStatus(`No track rows found in ${label}.`, true); return; }
  if (!state.CzReader) { const mod = await loadModule(MODULE_URL); state.CzReader = mod.CzReader; }
  setStatus(`Opening ${rows.length} track(s) from ${label}…`);
  let ok = 0, mism = 0; const failed = [];
  for (const r of rows) {
    try { const tr = await openCzTrack(r); if (tr.mismatch) mism++; saveTrack({ name: r.name, url: r.url, ctx: r.ctx }); ok++; }
    catch (e) { failed.push(`${r.name}: ${e.message}`); }
  }
  buildTrackRows(); render();
  const grouped = rows.some(r => r.group);
  setStatus(`Added ${ok}/${rows.length} track(s) from ${label}${grouped ? ' (grouped)' : ''}.` +
    (mism ? ` ⚠ ${mism} have coordinates not matching the reference.` : '') +
    (failed.length ? ` Failed: ${failed.slice(0, 3).join('; ')}${failed.length > 3 ? '…' : ''}` : ''),
    (failed.length > 0 && ok === 0) || mism > 0);
}

async function onTrackTableFile(ev) {
  const file = ev.target.files && ev.target.files[0]; ev.target.value = '';
  if (!file) return;

  } catch (e) { setStatus('Failed to load color palette URL: ' + e.message, true); }
}

function removeTrack(id) {
  const i = state.tracks.findIndex(t => t.id === id);
  if (i < 0) return;

// ── DOM: build ruler + track rows ────────────────────────────────────────────
function buildTrackRows() {
  const host = $('tracks');
  host.innerHTML = '';
  if (state.tracks.length === 0) {
    host.innerHTML = '<div class="empty hint">No tracks yet. Select a <b>Genome</b> to load sequence + gene tracks, or add a methylation <b>+ Add cz track</b>.</div>';
    return;
  }

  // Ruler row
  const rr = document.createElement('div');
  rr.className = 'row rulerrow';
  rr.innerHTML = `<div class="label"><div class="tname">Position</div>
    <div class="meta" id="rulerMeta"></div></div>`;
  const rv = document.createElement('div');
  rv.className = 'view'; rv.dataset.ruler = '1';
  const rc = document.createElement('canvas');
  rv.appendChild(rc); rr.appendChild(rv); host.appendChild(rr);
  state.rulerCanvas = rc; state.rulerView = rv;
  attachPanZoom(rv);

  const ordered = orderedTracksForDisplay();
  const gColors = groupColorMap(ordered);
  let prevGroup = null;
  for (const t of ordered) {
    const grp = t.kind === 'mc' ? (t.group || '') : '';
    // Group header: shown before the first track of each named group.
    if (grp && grp !== prevGroup) {
      const gh = document.createElement('div');
      gh.className = 'grouphdr';
      gh.style.borderLeft = `4px solid ${gColors[grp]}`;
      gh.textContent = grp;
      host.appendChild(gh);
    }
    if (t.kind === 'mc') prevGroup = grp;

    const row = document.createElement('div');
    row.className = 'row' + (grp ? ' grouped' : '');

// Track display order: non-mc (sequence/gene) first, then methylation tracks

// insertion/table order is preserved).

  for (const t of mc) { const g = t.group || ''; if (!groupOrder.includes(g)) groupOrder.push(g); }

// ── Per-track height drag-resize ─────────────────────────────────────────────
function attachHeightResize(handle, t) {
  let dragId = null, startY = 0, h0 = 0;
  handle.addEventListener('pointerdown', (e) => {
    e.preventDefault(); e.stopPropagation();
    dragId = e.pointerId; startY = e.clientY; h0 = trackHeight(t);
    handle.classList.add('dragging');
    try { handle.setPointerCapture(e.pointerId); } catch (_) {}
  });
  handle.addEventListener('pointermove', (e) => {
    if (dragId !== e.pointerId) return;
    e.stopPropagation();
    t.height = Math.max(MIN_HEIGHT, Math.round(h0 + (e.clientY - startY)));
    render();
  });
  const end = (e) => {
    if (dragId !== e.pointerId) return;
    dragId = null; handle.classList.remove('dragging');
    try { handle.releasePointerCapture(e.pointerId); } catch (_) {}
  };
  handle.addEventListener('pointerup', end);
  handle.addEventListener('pointercancel', end);

// ── Track selection + batch actions ──────────────────────────────────────────
function selectedTracks() {
  return state.tracks.filter(t => state.selected.has(t.id));
}
// Checkbox click: Shift = range (in display order), Ctrl/⌘ = toggle, plain = toggle.
function handleSelectClick(t, e) {
  const ordered = orderedTracksForDisplay();
  const ids = ordered.map(x => x.id);
  if (e.shiftKey && state.lastSelectedId != null) {
    const a = ids.indexOf(state.lastSelectedId), b = ids.indexOf(t.id);
    if (a >= 0 && b >= 0) {
      const [lo, hi] = a < b ? [a, b] : [b, a];
      for (let i = lo; i <= hi; i++) state.selected.add(ids[i]);
    } else { state.selected.add(t.id); }
  } else {
    if (state.selected.has(t.id)) state.selected.delete(t.id);
    else state.selected.add(t.id);
    state.lastSelectedId = t.id;

}
// Reflect the selection in the DOM (row highlight + checkbox) and the action bar.
function updateSelBar() {
  for (const t of state.tracks) {
    const on = state.selected.has(t.id);
    if (t.selCb) t.selCb.checked = on;
    if (t.row) t.row.classList.toggle('selected', on);
  }
  const bar = $('selbar');
  if (!bar) return;
  const sel = selectedTracks();
  const n = sel.length;
  bar.classList.toggle('show', n > 0);
  const cnt = $('selcount');
  if (cnt) cnt.textContent = `${n} selected`;
  // Seed the color/height inputs from the first selected track.
  if (n) {

    const h = $('selHeight'); if (h) h.value = trackHeight(sel[0]);
  }
}
function clearSelection() {

}
// Move the selected tracks up/down by one position (dir = -1 up, +1 down).
function moveSelected(dir) {
  if (!state.selected.size) return;
  const ordered = orderedTracksForDisplay();
  const n = ordered.length;
  const sel = state.selected;
  if (dir < 0) {
    for (let i = 1; i < n; i++)
      if (sel.has(ordered[i].id) && !sel.has(ordered[i - 1].id))
        [ordered[i - 1], ordered[i]] = [ordered[i], ordered[i - 1]];
  } else {
    for (let i = n - 2; i >= 0; i--)
      if (sel.has(ordered[i].id) && !sel.has(ordered[i + 1].id))
        [ordered[i], ordered[i + 1]] = [ordered[i + 1], ordered[i]];
  }
  state.tracks = ordered;
  buildTrackRows();
  render();
}
function deleteSelected() {
  if (!state.selected.size) return;
  for (const t of selectedTracks()) if (t.reader) t.reader.close();
  state.tracks = state.tracks.filter(t => !state.selected.has(t.id));
  state.selected.clear();
  state.lastSelectedId = null;

}

// ── Y-axis limit editor (single track via its button, or many via the bar) ───

  const old = document.getElementById('ylimPopup'); if (old) old.remove();

    `<div style="font-weight:700;margin-bottom:8px;">Y-axis limits${mcTracks.length > 1 ? ` · ${mcTracks.length} tracks` : ''}</div>` +
    `<label><input type="radio" name="ylimMode" value="auto" ${cur ? '' : 'checked'}> Auto (scale to data)</label>` +
    `<label><input type="radio" name="ylimMode" value="fixed" ${cur ? 'checked' : ''}> Fixed` +

    `<div class="ylimbtns"><button class="secondary" id="ylimCancel">Cancel</button>` +

// ── Canvas sizing (HiDPI) ────────────────────────────────────────────────────
function sizeCanvas(canvas, cssH) {
  const dpr = window.devicePixelRatio || 1;
  const cssW = canvas.parentElement.clientWidth;
  canvas.width = Math.max(1, Math.round(cssW * dpr));
  canvas.height = Math.max(1, Math.round(cssH * dpr));
  canvas.style.height = cssH + 'px';
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, w: cssW, h: cssH };
}

// ── Render everything (serialized) ───────────────────────────────────────────
// Renders MUST NOT overlap: all tracks share one reference reader whose HTTP
// handle has mutable position/cache state. Concurrent renders (e.g. during a
// drag) would corrupt each other. Serialize: coalesce pending requests and run
// one renderNow() at a time, re-running once more if new state arrived.
let rendering = false;
let renderPending = false;
function render() {
  renderPending = true;
  if (!rendering) pump();
}
async function pump() {
  rendering = true;
  try {
    while (renderPending) {
      renderPending = false;
      await renderNow();
    }
  } finally {
    rendering = false;
  }
}

// Interactive (pan/zoom) render: repaint instantly from cached data for a smooth
// feel, and debounce the (networked) full render until the gesture settles.
let _fullTimer = null;
function renderInteractive() {
  quickRedraw();
  clearTimeout(_fullTimer);
  _fullTimer = setTimeout(render, 160);
}
function quickRedraw() {
  if (!state.locus || state.tracks.length === 0) return;
  drawRuler();

    try {
      if (t.kind === 'seq') drawSeqCore(t);
      else if (t.kind === 'gene') { if (t._genes) drawGenesCore(t, t._genes); }
      else if (t.kind === 'mc' && t._data) drawTrack(t, t._data.qi, t._data.vals);
    } catch (_) { /* ignore during fast repaint */ }
  }
  syncLocusInput();
}

async function renderNow() {
  if (!state.locus || state.tracks.length === 0) return;
  const gen = ++state.gen;
  const { chrom, start, end } = state.locus;

  // Only enforce the chromosome check against a loaded reference .cz.
  if (state.refReader && !state.chroms.includes(chrom)) {
    setStatus(`Chromosome “${chrom}” not in reference (have: ${state.chroms.slice(0, 6).join(', ')}…)`, true);
    return;
  }
  drawRuler();

  // Reference position/context index is only needed for methylation tracks.
  const hasMc = state.tracks.some(t => t.kind === 'mc');
  let qi = null;
  if (hasMc) {
    if (!state.refReader) {
      setStatus('Load a reference .cz before adding methylation tracks.', true);
    } else {
      try {
        const t0 = performance.now();
        qi = await state.refReader.queryWithIndex(chrom, Math.round(start), Math.round(end));
        if (gen !== state.gen) return;
        const tRef = (performance.now() - t0).toFixed(0);
        const rm = $('rulerMeta');
        if (rm) rm.textContent = `${fmtInt(qi.positions.length)} C sites · ${tRef} ms`;
      } catch (e) {
        setStatus('Reference query failed: ' + e.message, true);
        return;
      }
    }
  }

  // Fetch + draw each track. With many tracks (>3) load them sequentially from
  // top to bottom so the view fills in progressively instead of firing every
  // network request at once (which can freeze the tab). Few tracks → parallel.
  const drawOneTrack = async (t) => {
    if (gen !== state.gen) return;
    setTrackLoading(t, true);
    try {
      if (t.kind === 'seq') {
        await drawSeqTrack(t, gen);
      } else if (t.kind === 'gene') {
        await drawGeneTrack(t, gen);
      } else {
        if (!qi) return;
        const vals = await t.reader.getRowValues(chrom, qi.rowStart, qi.rowEnd);
        if (gen !== state.gen) return;
        t._data = { qi, vals };
        drawTrack(t, qi, vals);
      }
    } catch (e) {
      setStatus(`Track “${t.name}” fetch failed: ` + e.message, true);
    } finally {
      setTrackLoading(t, false);
    }
  };
  const drawOrder = orderedTracksForDisplay();
  if (drawOrder.length > 3) {
    for (const t of drawOrder) {
      if (gen !== state.gen) return;
      await drawOneTrack(t);
    }
  } else {
    await Promise.all(drawOrder.map(drawOneTrack));
  }
  if (gen !== state.gen) return;

  syncUrlState();
}
function setTrackLoading(t, on) {

}

// ── Draw one methylation track (binned by pixel column) ──────────────────────
// `dst` (optional) = { ctx, w, h } to draw into an export recorder instead of
// the live canvas; when present, live-only side effects (hover data, meta) skip.
function drawTrack(track, qi, vals, dst) {
  const H = trackHeight(track);
  const live = !dst;
  const { ctx, w, h } = dst || sizeCanvas(track.canvas, H);
  ctx.clearRect(0, 0, w, h);

  const pad = 6;
  const plotH = h - pad * 2;
  const baseY = h - pad;
  const { start, end } = state.locus;
  const span = end - start;

  // Aggregate mc/cov either per pixel column (native, per-bp) or into fixed
  // genomic bins of `state.resolution` bp. sumMc/sumCov stay pixel-indexed so
  // the hover tooltip works the same in both modes. Bars are collected first so
  // we can compute the y-axis max for 'auto' scaling before drawing.
  const W = Math.max(1, Math.floor(w));
  const sumMc = new Float64Array(W);
  const sumCov = new Float64Array(W);
  const pos = qi.positions, recs = qi.records;
  let nSites = 0, totMc = 0, totCov = 0;
  const nCommon = Math.min(pos.length, vals.length);
  const rgb = hexToRgb(track.color);
  const res = state.resolution;   // null → per-bp; otherwise bin width in bp
  const alphaFor = (c) => 0.35 + 0.65 * Math.min(1, Math.log10(1 + c) / 1.5);
  const bars = [];   // { x, bw, level, cov }
  let maxLevel = 0;

  if (!res) {
    for (let i = 0; i < nCommon; i++) {
      if (!ctxMatch(recs[i][2], track.ctx)) continue;
      const cov = vals[i][1];
      if (!cov) continue;
      const mc = vals[i][0];
      const px = Math.floor((pos[i] - start) / span * W);
      if (px < 0 || px >= W) continue;
      sumMc[px] += mc; sumCov[px] += cov;
      nSites++; totMc += mc; totCov += cov;
    }
    for (let px = 0; px < W; px++) {
      const c = sumCov[px];
      if (!c) continue;
      let level = sumMc[px] / c;
      if (track.valType === 'unmeth') level = 1 - level;
      if (level > maxLevel) maxLevel = level;
      bars.push({ x: px, bw: 1, level, cov: c });
    }
  } else {
    const nBins = Math.max(1, Math.ceil(span / res));
    const binMc = new Float64Array(nBins);
    const binCov = new Float64Array(nBins);
    const binStart0 = Math.floor(start / res) * res;   // align bins to genome grid
    for (let i = 0; i < nCommon; i++) {
      if (!ctxMatch(recs[i][2], track.ctx)) continue;
      const cov = vals[i][1];
      if (!cov) continue;
      const mc = vals[i][0];
      const b = Math.floor((pos[i] - binStart0) / res);
      if (b < 0 || b >= nBins) continue;
      binMc[b] += mc; binCov[b] += cov;
      nSites++; totMc += mc; totCov += cov;
    }
    for (let b = 0; b < nBins; b++) {
      const c = binCov[b];
      if (!c) continue;
      const bpS = binStart0 + b * res, bpE = bpS + res;
      const x0 = (bpS - start) / span * w, x1 = (bpE - start) / span * w;
      let level = binMc[b] / c;
      if (track.valType === 'unmeth') level = 1 - level;
      if (level > maxLevel) maxLevel = level;
      bars.push({ x: x0, bw: Math.max(1, x1 - x0), level, cov: c });
      const px0 = Math.max(0, Math.floor(x0)), px1 = Math.min(W, Math.ceil(x1));
      for (let px = px0; px < px1; px++) { sumMc[px] = binMc[b]; sumCov[px] = binCov[b]; }
    }
  }

  // Y-axis limits: a per-track ylim overrides the global toolbar scale.
  //   ylim = [min, max] → fixed range; 'auto' → 0..dataMax for THIS track;
  //   unset (legacy sessions) falls back to the global Y setting (0–1 / auto).
  let scaleMin = 0, scaleMax;
  if (Array.isArray(track.ylim)) {
    scaleMin = track.ylim[0]; scaleMax = track.ylim[1];
  } else if (track.ylim === 'auto') {
    scaleMax = maxLevel || 1;
  } else {
    scaleMax = state.yScale === 'auto' ? (maxLevel || 1) : 1;
  }
  const scaleSpan = (scaleMax - scaleMin) || 1;

  // Gridlines (0, mid, max) at the current y-axis scale.
  ctx.strokeStyle = '#eceef2'; ctx.lineWidth = 1;
  ctx.fillStyle = '#b8bcc8'; ctx.font = '9px sans-serif'; ctx.textBaseline = 'middle';
  const fmtLv = (v) => (scaleSpan < 0.2 ? v.toFixed(3) : (scaleSpan < 1 ? v.toFixed(2) : v.toFixed(1)));
  for (const frac of [0, 0.5, 1]) {
    const y = baseY - frac * plotH;
    ctx.beginPath(); ctx.moveTo(0, y + 0.5); ctx.lineTo(w, y + 0.5); ctx.stroke();
    ctx.fillText(fmtLv(scaleMin + frac * scaleSpan), 2, y - 5);
  }

  // Bars: height = (level − min) / span; opacity ramps with coverage depth.
  for (const b of bars) {
    const barH = Math.max(0, Math.min(1, (b.level - scaleMin) / scaleSpan)) * plotH;
    ctx.fillStyle = `rgba(${rgb.r},${rgb.g},${rgb.b},${alphaFor(b.cov).toFixed(3)})`;
    ctx.fillRect(b.x, baseY - barH, b.bw, barH);
  }

  // Baseline
  ctx.strokeStyle = '#c9cdd6';
  ctx.beginPath(); ctx.moveTo(0, baseY + 0.5); ctx.lineTo(w, baseY + 0.5); ctx.stroke();

  // Store for hover tooltip (live only)
  if (live) track._draw = { start, end, W, sumMc, sumCov };

  const meanM = totCov ? (totMc / totCov) : 0;
  const meanShown = track.valType === 'unmeth' ? (1 - meanM) : meanM;
  const valTag = track.valType === 'unmeth' ? '1−mC' : 'mC';
  const resLabel = res ? ` · ${res} bp bins` : '';
  const scaleLabel = Array.isArray(track.ylim)
    ? ` · y[${scaleMin}–${scaleMax}]`
    : ((track.ylim === 'auto' || state.yScale === 'auto') ? ` · y≤${(scaleMax * 100).toFixed(0)}%` : '');
  if (live && track.metaEl) {
    track.metaEl.textContent = nSites
      ? `${fmtInt(nSites)} covered · mean ${(meanShown * 100).toFixed(1)}% ${valTag} · ${track.ctx}${resLabel}${scaleLabel}`
      : `no covered ${track.ctx} sites here`;
  }
}

function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };

// ── Draw the reference DNA sequence track (.2bit) ────────────────────────────

  const w = dst ? dst.w : (track.canvas.parentElement.clientWidth || 1);
  const { chrom, start, end } = state.locus;
  const perBase = w / (end - start);
  if (perBase >= 5 && !(dst && track._seqData)) {
    const s = Math.max(0, Math.floor(start)), e = Math.ceil(end);
    const tb = await loadTwoBit(track.genome || state.genome);
    const seq = ((await tb.getSequence(chrom, s, e)) || '').toUpperCase();
    if (gen !== state.gen) return;

}

}

  let s = mid - span / 2, en = mid + span / 2;
  if (s < 0) { en -= s; s = 0; }
  state.locus = { chrom, start: s, end: en };
  syncLocusInput(); render();
}

// ── Hover tooltip (mc bins + gene models) ────────────────────────────────────
function geneAtEvent(track, e) {
  if (!track._placed) return null;
  const rect = track.view.getBoundingClientRect();
  const px = (e.clientX - rect.left) / rect.width * track._placed.wCss;
  const py = e.clientY - rect.top;
  const { placed, rowH, topPad } = track._placed;
  const row = Math.floor((py - topPad) / rowH);
  let best = null;
  for (const p of placed) {
    if (p.row !== row) continue;
    if (px >= p.x0 - 2 && px <= p.x1 + 2) { best = p; break; }
    if (px >= p.x0 - (p.label.length * 6 + 6) && px < p.x0) best = best || p;  // over the label
  }
  return best;
}
function updateHover(e) {
  const hv = $('hover');
  const track = state.tracks.find(t => t.view && t.view.contains(e.target));
  if (!track) { hv.style.display = 'none'; return; }

  // Gene track: identify the gene under the cursor.
  if (track.kind === 'gene') {
    const p = geneAtEvent(track, e);
    if (!p) { hv.style.display = 'none'; track.view.style.cursor = ''; return; }
    const gd = p.gd;
    hv.textContent = `${gd.name || gd.id} · ${gd.chrom}:${fmtInt(gd.txStart)}-${fmtInt(gd.txEnd)} · ` +
      `${gd.strand || ''} ${gd.transcriptionClass || ''} · click for details`;
    hv.style.left = (e.clientX + 12) + 'px';
    hv.style.top = (e.clientY + 12) + 'px';
    hv.style.display = 'block';
    track.view.style.cursor = 'pointer';
    return;
  }

  if (!track._draw) { hv.style.display = 'none'; return; }
  const rect = track.view.getBoundingClientRect();
  const px = Math.floor((e.clientX - rect.left) / rect.width * track._draw.W);
  const d = track._draw;
  if (px < 0 || px >= d.W || !d.sumCov[px]) { hv.style.display = 'none'; return; }
  let level = d.sumMc[px] / d.sumCov[px];
  const valTag = track.valType === 'unmeth' ? '1−mC' : 'mC';
  if (track.valType === 'unmeth') level = 1 - level;
  const bp = Math.round(d.start + (px + 0.5) / d.W * (d.end - d.start));
  hv.textContent = `${track.name} · ~${fmtInt(bp)} · ${(level * 100).toFixed(0)}% ${valTag} · cov ${Math.round(d.sumCov[px])}`;
  hv.style.left = (e.clientX + 12) + 'px';
  hv.style.top = (e.clientY + 12) + 'px';
  hv.style.display = 'block';
}

// Click on a gene → detail popup with external links.
function handleViewClick(view, e) {
  const track = state.tracks.find(t => t.view === view);
  if (!track || track.kind !== 'gene') return;
  const p = geneAtEvent(track, e);
  if (p) showGeneDetail(p.gd, track.genome || state.genome, e.clientX, e.clientY);
}
function showGeneDetail(gd, genome, x, y) {
  const old = document.getElementById('genePopup'); if (old) old.remove();
  const name = gd.name || gd.id || 'gene';
  const loc = `${gd.chrom}:${gd.txStart}-${gd.txEnd}`;
  const ucsc = `https://genome.ucsc.edu/cgi-bin/hgTracks?db=${encodeURIComponent(genome)}&position=${encodeURIComponent(gd.chrom + ':' + gd.txStart + '-' + gd.txEnd)}`;
  const isEns = /^ENS/i.test(gd.id || '');
  const ensembl = isEns
    ? `https://www.ensembl.org/${genome && genome.startsWith('mm') ? 'Mus_musculus' : 'Homo_sapiens'}/Gene/Summary?g=${encodeURIComponent((gd.id || '').split('.')[0])}`
    : `https://www.ensembl.org/Multi/Search/Results?q=${encodeURIComponent(name)}`;
  const ncbi = `https://www.ncbi.nlm.nih.gov/gene/?term=${encodeURIComponent(name)}`;
  const pop = document.createElement('div');
  pop.id = 'genePopup';
  pop.style.cssText = 'position:fixed;z-index:100;background:#fff;border:1px solid #c9cdd6;border-radius:6px;' +
    'box-shadow:0 6px 24px rgba(0,0,0,.18);padding:10px 12px;font-size:12px;max-width:340px;color:#1c1e26;';
  pop.innerHTML =
    `<div style="font-weight:700;font-size:13px;margin-bottom:3px;">${escapeHtml(String(name))}</div>` +
    `<div style="color:#6b7180;">${escapeHtml(String(gd.id || ''))} · ${escapeHtml(gd.strand || '')} · ${escapeHtml(gd.transcriptionClass || '')}</div>` +
    `<div style="margin:3px 0;">${escapeHtml(loc)}</div>` +
    (gd.description ? `<div style="margin:4px 0;color:#3a3f57;">${escapeHtml(String(gd.description)).slice(0, 220)}</div>` : '') +
    `<div style="margin-top:6px;display:flex;gap:10px;">` +
    `<a href="${ucsc}" target="_blank" rel="noopener">UCSC</a>` +
    `<a href="${ensembl}" target="_blank" rel="noopener">Ensembl</a>` +
    `<a href="${ncbi}" target="_blank" rel="noopener">NCBI</a>` +
    `<span style="margin-left:auto;cursor:pointer;color:#8a8f9c;" id="genePopupClose">✕</span></div>`;
  document.body.appendChild(pop);
  const px = Math.min(x + 12, window.innerWidth - pop.offsetWidth - 8);
  const py = Math.min(y + 12, window.innerHeight - pop.offsetHeight - 8);
  pop.style.left = Math.max(4, px) + 'px';
  pop.style.top = Math.max(4, py) + 'px';
  pop.querySelector('#genePopupClose').onclick = () => pop.remove();
  const closer = (ev) => { if (!pop.contains(ev.target)) { pop.remove(); document.removeEventListener('pointerdown', closer, true); } };
  setTimeout(() => document.addEventListener('pointerdown', closer, true), 0);
}

// ── Wire up controls ─────────────────────────────────────────────────────────
$('btnLoad').onclick = loadReference;
$('btnAddTrack').onclick = addTrack;
$('trackTable').onchange = onTrackTableFile;
$('btnTrackTableUrl').onclick = onTrackTableUrl;
$('colorFile').onchange = onColorFile;
$('btnColorUrl').onclick = onColorUrl;
$('btnSvg').onclick = () => downloadView('svg');
$('btnPng').onclick = () => downloadView('png');
$('btnPdf').onclick = () => downloadView('pdf');
$('yScaleSel').onchange = () => {
  state.yScale = $('yScaleSel').value;
  // The toolbar Y control is a bulk setter: apply it to every mc track's ylim.
  const yl = state.yScale === 'auto' ? 'auto' : [0, 1];
  for (const t of state.tracks) if (t.kind === 'mc') t.ylim = Array.isArray(yl) ? [...yl] : yl;
  buildTrackRows(); render();
};
$('btnSaveSession').onclick = saveSession;
$('sessionFile').onchange = loadSessionFile;
$('genomeSel').onchange = onGenomeChange;
$('geneSet').onchange = () => {
  const g = state.genome;
  if (!g) return;
  const set = $('geneSet').value.trim() || 'refGene';
  const gt = state.tracks.find(t => t.kind === 'gene');
  if (gt) {
    gt.geneSet = set; gt.genome = g; gt.name = `${set} (${g})`;
    gt.url = `${GENE_API}/${g}/genes/${set}/queryRegion`;
    buildTrackRows(); render();
    setStatus(`Gene set switched to “${set}”.`);
  } else {
    addGeneTrack();
  }
};
$('savedTracks').onchange = onSavedTrackPick;
$('btnForgetTracks').onclick = () => {
  try { localStorage.removeItem(SAVED_TRACKS_KEY); } catch {}
  refreshSavedTracksUI();
  setStatus('Cleared saved tracks.');
};
// Locus box: accepts a coordinate (chr:start-end) or, when a genome is loaded,
// a gene name (searched via the WashU queryName API).
async function goToLocusOrGene() {
  const text = $('locus').value.trim();
  if (!text) return;
  const l = parseLocus(text);
  if (l) { state.locus = l; render(); return; }
  if (state.genome) {
    setStatus(`Searching gene “${text}”…`);
    try {
      const gene = await searchGeneByName(text);
      if (gene) {
        const len = Math.max(1, gene.txEnd - gene.txStart);
        const pad = Math.max(1000, Math.round(len * 0.15));
        state.locus = { chrom: gene.chrom, start: Math.max(0, gene.txStart - pad), end: gene.txEnd + pad };
        syncLocusInput(); render();
        setStatus(`${gene.name} · ${gene.collection || 'gene'} · ${gene.strand || ''} · ${locusText(state.locus)}`);
        return;
      }
      setStatus(`No gene named “${text}” found, and it isn’t a valid locus.`, true);
    } catch (e) {
      setStatus('Gene search failed: ' + e.message, true);
    }
    return;
  }
  setStatus('Bad locus. Use chr:start-end, or select a Genome to search by gene name.', true);
}
$('btnGo').onclick = goToLocusOrGene;
$('locus').addEventListener('keydown', (e) => { if (e.key === 'Enter') goToLocusOrGene(); });
$('zoomIn').onclick = () => zoomBy(0.5);
$('zoomOut').onclick = () => zoomBy(2);
$('resSel').onchange = () => {
  const v = $('resSel').value;
  state.resolution = v ? parseInt(v, 10) : null;
  render();
};
$('newUrl').addEventListener('keydown', (e) => { if (e.key === 'Enter') addTrack(); });
window.addEventListener('resize', () => render());

// ── Selection action bar ─────────────────────────────────────────────────────
$('selUp').onclick = () => moveSelected(-1);
$('selDown').onclick = () => moveSelected(1);
$('selColor').oninput = (e) => setSelectedColor(e.target.value);
$('selHeight').onchange = (e) => setSelectedHeight(parseInt(e.target.value, 10));
$('selYlim').onclick = (e) => openYlimEditor(selectedTracks(), e.currentTarget);
$('selDelete').onclick = deleteSelected;
$('selClear').onclick = clearSelection;

refreshSavedTracksUI();
setStatus('Ready. Pick a Genome to auto-load its DNA sequence + gene tracks, then search a ' +
          'locus (chr:start-end) or a gene name. Add methylation data with “+ Add cz track” ' +
          'or a track table; export as SVG/PNG/PDF; save/share via the URL or Session JSON.');
// Restore a shared view from the URL hash, else start on the default genome.
restoreFromUrl().then((restored) => { if (!restored) onGenomeChange(); });


</script>
